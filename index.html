<!DOCTYPE html>
<html lang="pt-BR">
<head>
<script>
  // Evita que o navegador restaure a posição de scroll antiga ao recarregar
  // a página (isso acontecia após a verificação automática de atualização).
  if ('scrollRestoration' in history) { history.scrollRestoration = 'manual'; }
</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Painel de Treino</title>

<!-- PWA: permite instalar como app e abrir sem a barra de endereço -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0E1013">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Treino">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght=500;600;700&family=Inter:wght=400;500;600;700;800&display=swap" rel="stylesheet">
<!-- Importação do Chart.js para o Gráfico Interativo da tela de Perfil -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<!-- Firebase: login por e-mail/senha + Firestore para sincronizar os dados entre aparelhos -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
  :root{
    --bg: #0E1013;
    --surface: #1A1D23;
    --text: #F2F1ED;
    --text-dim: #9A9CA5;
    --text-faint: #63656E;
    --amber: #FF7A3D;
    --amber-2: #FFB088;
    --amber-light: #FFB088;
    --green-accent: #5CE1B2;
    --blue-accent: #4B90FF;
    --card-bg: #14171C;
    --text-secondary: #8E919A;
    --border: rgba(255, 255, 255, 0.05);
  }

  *{ box-sizing: border-box; margin:0; padding:0; }

  html{
    height: 100%;
    overflow-x: hidden;
    -webkit-text-size-adjust: 100%;
    text-size-adjust: 100%;
  }

  body {
    background-color: #050505;
    font-family: 'Inter', sans-serif;
    color: var(--text);
    display: flex;
    justify-content: center;
    align-items: flex-start;
    min-height: 100vh;
    min-height: 100dvh;
    width: 100%;
    overflow-x: hidden;
    overscroll-behavior-y: none;
    -webkit-tap-highlight-color: transparent;
  }

  .device{
    width: 100%;
    max-width: 430px;
    height: 100vh;
    height: 100dvh;
    background: var(--bg);
    display: flex;
    flex-direction: column;
    position: relative;
    overflow-y: auto;
    overflow-x: hidden;
    overscroll-behavior-y: contain;
    touch-action: pan-y;
    scrollbar-width: none; /* Firefox */
    overflow-anchor: none; /* evita que o navegador reajuste o scroll sozinho quando imagens carregam depois */
  }
  .device::-webkit-scrollbar { display: none; } /* Chrome/Safari */

  /* CONTEÚDO PRINCIPAL */
  .content{
    padding: 24px 20px 32px;
    display: flex;
    flex-direction: column;
    gap: 24px;
    flex-grow: 1;
  }

  /* BARRA DE NAVEGAÇÃO INFERIOR */
  .bottom-nav {
    position: sticky;
    bottom: 0;
    left: 0;
    width: 100%;
    height: 76px;
    background: #0E1013;
    border-top: 1.5px solid rgba(255, 255, 255, 0.03);
    display: flex;
    justify-content: space-around;
    align-items: center;
    z-index: 1000;
    flex-shrink: 0;
    padding-bottom: max(8px, env(safe-area-inset-bottom));
  }

  .nav-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-decoration: none;
    gap: 6px;
    flex: 1;
    height: 100%;
    color: #4B4D54; /* Cor inativa */
    transition: color 0.2s ease;
  }

  .nav-item svg {
    width: 24px;
    height: 24px;
    transition: transform 0.2s ease;
  }

  .nav-item span {
    font-family: 'Inter', sans-serif;
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.01em;
  }

  /* Estado Ativo: Tom salmão/laranja da foto */
  .nav-item.active {
    color: #FFB088; 
  }

  .nav-item:hover svg {
    transform: translateY(-1px);
  }

  /* ==================================================== */
  /* ========= MODAL GLOBAL: CONQUISTA DESBLOQUEADA ====== */
  /* ==================================================== */

  .achievement-unlock-overlay {
    position: fixed;
    top: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 100%;
    max-width: 430px;
    height: 100%;
    background: rgba(5, 5, 5, 0.88);
    backdrop-filter: blur(8px);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 6000;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s ease;
    padding: 24px;
    box-sizing: border-box;
  }

  .achievement-unlock-overlay.active {
    opacity: 1;
    pointer-events: all;
  }

  .achievement-unlock-card {
    position: relative;
    width: 100%;
    background: radial-gradient(circle at 50% 0%, rgba(255, 122, 61, 0.18) 0%, rgba(26, 29, 35, 0) 60%), var(--surface);
    border: 1.8px solid var(--amber);
    border-radius: 28px;
    padding: 32px 24px 24px;
    text-align: center;
    box-shadow: 0 20px 60px rgba(255, 122, 61, 0.25);
    transform: scale(0.82) translateY(16px);
    transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  .achievement-unlock-overlay.active .achievement-unlock-card {
    transform: scale(1) translateY(0);
  }

  .achievement-unlock-eyebrow {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 12.5px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--amber-2);
    font-weight: 700;
    margin-bottom: 16px;
  }

  .achievement-unlock-badge {
    width: 108px;
    height: 108px;
    margin: 0 auto 18px;
    filter: drop-shadow(0px 6px 16px rgba(255, 122, 61, 0.4));
  }

  .achievement-unlock-badge img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    border-radius: 16px;
  }

  .achievement-unlock-title {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 22px;
    font-weight: 700;
    color: var(--text);
    margin-bottom: 8px;
  }

  .achievement-unlock-desc {
    font-size: 14px;
    line-height: 1.4;
    color: var(--text-dim);
    margin-bottom: 26px;
  }

  .achievement-unlock-btn {
    width: 100%;
    padding: 15px;
    border-radius: 12px;
    border: none;
    background: var(--amber);
    color: #000;
    font-family: 'Space Grotesk', sans-serif;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.2s ease;
  }

  .achievement-unlock-btn:active {
    transform: scale(0.97);
    background: var(--amber-2);
  }

  /* ==================================================== */
  /* ================ TELA: INÍCIO ======================= */
  /* ==================================================== */

  /* HEADER */
  #tela-inicio .header{
    padding: 32px 20px 20px;
    background: linear-gradient(180deg, #1B1C22 0%, #101116 100%);
    border-bottom: 1px solid rgba(255,255,255,0.07);
    flex-shrink: 0;
    margin: -24px -20px 0;
  }

  #tela-inicio .header-top{
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
  }

  #tela-inicio .header-top .label{
    font-family: 'Space Grotesk', sans-serif;
    font-size: 15px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: #888;
    font-weight: 600;
  }

  #tela-inicio .week-controls {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  #tela-inicio .week-nav-btn {
    background: rgba(255, 255, 255, 0.05);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 8px;
    width: 32px;
    height: 32px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--text);
    cursor: pointer;
    transition: all 0.2s ease;
  }

  #tela-inicio .week-nav-btn:hover:not(:disabled) {
    background: rgba(255, 255, 255, 0.15);
  }

  #tela-inicio .week-nav-btn:disabled {
    opacity: 0.25;
    cursor: not-allowed;
  }

  #tela-inicio .day-strip{
    display: flex;
    justify-content: space-between;
    gap: 6px;
    padding: 8px 0;
  }

  /* DAY-PILL */
  #tela-inicio .day-pill{
    flex: 1;
    min-width: 0;
    height: 76px;
    background: #1F232B;
    border: 2px solid transparent;
    border-radius: 16px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 4px;
    cursor: pointer;
    transition: all 0.25s ease;

    font-family: inherit;
    outline: none;
    -webkit-appearance: none;
    appearance: none;
  }

  #tela-inicio .day-pill:hover:not(:disabled){
    transform: translateY(-2px);
  }

  #tela-inicio .day-pill:focus-visible {
    outline: 2px solid var(--amber-2);
    outline-offset: 2px;
  }

  #tela-inicio .day-pill .num {
    color: #FFFFFF;
    font-family: 'Space Grotesk', sans-serif;
    font-size: 18px;
    font-weight: 700;
  }

  #tela-inicio .day-pill .dow {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    color: rgba(255, 255, 255, 0.6);
    font-weight: 500;
  }

  #tela-inicio .day-pill.selected {
    border-color: var(--amber);
  }

  #tela-inicio .day-pill.today{
    background: linear-gradient(160deg, var(--amber), #FF9A5E);
    border-color: #FFBB8A;
    box-shadow: 0 4px 12px rgba(255,122,61,0.4);
  }

  #tela-inicio .day-pill.today .num,
  #tela-inicio .day-pill.today .dow{
    color: #FFFFFF !important;
    opacity: 1 !important;
    font-weight: 700;
  }

  #tela-inicio .day-pill.past.workout .num {
    color: var(--amber) !important;
  }
  #tela-inicio .day-pill.past.workout .dow {
    color: var(--amber-2) !important;
  }

  #tela-inicio .day-pill.past.no-workout .num {
    color: #FFFFFF !important;
  }
  #tela-inicio .day-pill.past.no-workout .dow {
    color: rgba(255, 255, 255, 0.6) !important;
  }

  #tela-inicio .day-pill:disabled {
    cursor: not-allowed;
    opacity: 0.25;
  }

  /* CONTEÚDO DO DASHBOARD */
  #tela-inicio .dashboard-content{
    padding: 24px 0 0;
    display: flex;
    flex-direction: column;
    gap: 28px;
  }

  /* CARD FRASE DO DIA */
  #tela-inicio .quote-card{
    position: relative;
    background: radial-gradient(circle at 90% 50%, rgba(255, 122, 61, 0.15) 0%, rgba(26, 29, 35, 0) 70%), #16181D;
    border: 1.5px solid rgba(255, 255, 255, 0.04);
    border-radius: 28px;
    padding: 24px;
    overflow: hidden;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  #tela-inicio .quote-info{
    max-width: 65%;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  #tela-inicio .quote-label{
    font-family: 'Space Grotesk', sans-serif;
    font-size: 12px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--amber-2);
    font-weight: 700;
  }

  #tela-inicio .quote-title{
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 700;
    font-size: 22px;
    line-height: 1.25;
    color: var(--text);
    min-height: 54px;
    display: flex;
    align-items: center;
  }

  #tela-inicio .quote-subtext{
    font-size: 13.5px;
    line-height: 1.4;
    color: var(--text-dim);
  }

  #tela-inicio .quote-icon{
    flex-shrink: 0;
    margin-right: 8px;
  }

  /* SEÇÃO RESUMO DA SEMANA */
  #tela-inicio .summary-section{
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  #tela-inicio .section-title{
    font-family: 'Inter', sans-serif;
    font-weight: 700;
    font-size: 20px;
    color: var(--text);
  }

  #tela-inicio .stats-grid{
    display: grid;
    grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
    gap: 16px;
  }

  #tela-inicio .stat-card{
    background: #16181D;
    border: 1.5px solid rgba(255, 255, 255, 0.04);
    border-radius: 20px;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    min-width: 0;
    overflow: hidden;
  }

  #tela-inicio .stat-header {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 10px;
    min-width: 0;
    width: 100%;
  }

  #tela-inicio .stat-icon-wrapper{
    width: 38px;
    height: 38px;
    border-radius: 11px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  #tela-inicio .stat-icon-wrapper.orange{
    background: rgba(255, 122, 61, 0.1);
  }

  #tela-inicio .stat-icon-wrapper.blue{
    background: rgba(75, 144, 255, 0.1);
  }

  #tela-inicio .stat-value{
    font-family: 'Inter', sans-serif;
    font-weight: 800;
    font-size: 32px;
    line-height: 1;
  }

  #tela-inicio .stat-value.orange{
    color: var(--amber);
  }

  #tela-inicio .stat-value.blue{
    color: var(--blue-accent);
  }

  #tela-inicio .stat-label{
    font-size: 13px;
    color: #FFFFFF;
    font-weight: 800;
    line-height: 1.3;
    min-width: 0;
    width: 100%;
    overflow-wrap: normal;
    word-break: normal;
  }

  /* SEÇÃO: HISTÓRICO */
  #tela-inicio .history-card {
    background: #16181D;
    border: 1.5px solid rgba(255, 255, 255, 0.04);
    border-radius: 28px;
    padding: 24px;
    display: flex;
    flex-direction: column;
  }

  #tela-inicio .history-header {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 20px;
    font-weight: 700;
    color: var(--text);
    margin-bottom: 8px;
  }

  #tela-inicio .history-list {
    display: flex;
    flex-direction: column;
  }

  #tela-inicio .history-empty {
    padding: 20px 4px 4px;
    font-size: 13.5px;
    color: var(--text-dim);
    text-align: center;
  }

  #tela-inicio .history-item {
    display: flex;
    align-items: center;
    padding: 16px 0;
    border-bottom: 1.5px solid rgba(255, 255, 255, 0.04);
    cursor: pointer;
    transition: background-color 0.2s ease;
  }

  #tela-inicio .history-item:last-child {
    border-bottom: none;
    padding-bottom: 4px;
  }

  #tela-inicio .history-item:hover {
    background-color: rgba(255, 255, 255, 0.01);
  }

  #tela-inicio .history-date {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-width: 52px;
    margin-right: 16px;
  }

  #tela-inicio .history-date .day-num {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 24px;
    font-weight: 700;
    line-height: 1;
  }

  #tela-inicio .history-item.workout .day-num {
    color: var(--amber);
  }

  #tela-inicio .history-item.body-info .day-num {
    color: var(--blue-accent);
  }

  #tela-inicio .history-date .day-name {
    font-size: 11px;
    text-transform: uppercase;
    font-weight: 600;
    letter-spacing: 0.05em;
    color: var(--text-faint);
    margin-top: 4px;
  }

  #tela-inicio .history-info {
    flex-grow: 1;
    display: flex;
    flex-direction: column;
    gap: 3px;
  }

  #tela-inicio .history-info-title {
    font-size: 16px;
    font-weight: 600;
    color: var(--text);
  }

  #tela-inicio .history-info-desc {
    font-size: 13.5px;
    color: var(--text-dim);
  }

  #tela-inicio .history-chevron {
    color: var(--text-faint);
    display: flex;
    align-items: center;
    justify-content: center;
    margin-left: 8px;
  }

  /* SEÇÃO: GRUPOS MUSCULARES */
  #tela-inicio .muscles-section {
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  #tela-inicio .section-header-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  #tela-inicio .section-header-link {
    font-family: 'Inter', sans-serif;
    font-size: 14px;
    font-weight: 600;
    color: var(--amber);
    text-decoration: none;
    display: flex;
    align-items: center;
    gap: 4px;
  }

  #tela-inicio .muscles-grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: 16px;
  }

  #tela-inicio .muscle-status-card {
    background: #16181D;
    border: 1.5px solid rgba(255, 255, 255, 0.04);
    border-radius: 24px;
    padding: 20px;
    display: flex;
    align-items: stretch;
    gap: 16px;
  }

  #tela-inicio .muscle-body-visual {
    flex-shrink: 0;
    width: 105px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  #tela-inicio .muscle-body-visual img {
    width: 100%;
    height: 100%;
    max-height: 100%;
    object-fit: contain;
    border-radius: 8px;
  }

  #tela-inicio .muscle-bars-list {
    flex-grow: 1;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    gap: 4px;
  }

  #tela-inicio .muscle-bar-item {
    display: flex;
    flex-direction: column;
    gap: 2px;
  }

  #tela-inicio .muscle-bar-info {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 8px;
    font-size: 11.5px;
    font-weight: 600;
  }

  #tela-inicio .muscle-bar-name {
    color: var(--text-dim);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    min-width: 0;
  }

  #tela-inicio .muscle-bar-value {
    color: var(--text);
    white-space: nowrap;
    flex-shrink: 0;
  }

  #tela-inicio .muscle-bar-track {
    height: 6px;
    background: rgba(255, 255, 255, 0.06);
    border-radius: 3px;
    overflow: hidden;
  }

  #tela-inicio .muscle-bar-fill {
    height: 100%;
    background: var(--amber);
    border-radius: 3px;
  }

  /* ==================================================== */
  /* ================ TELA: HISTÓRICO ==================== */
  /* ==================================================== */

  #tela-historico {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background-color: #121214;
    color: #FFFFFF;
    border-radius: 20px;
    padding: 16px;
    box-sizing: border-box;
    display: flex;
    flex-direction: column;
  }

  #tela-historico .header { margin-top: 0; margin-bottom: 24px; }
  #tela-historico .header h2 { font-size: 14px; color: #A8A8B3; margin: 0; font-weight: 400; }
  #tela-historico .header h1 { font-size: 28px; color: #FF6C22; margin: 4px 0 0 0; text-transform: uppercase; font-weight: 800; }

  #tela-historico .calendar-card { background-color: #1E1715; border-radius: 16px; padding: 16px; margin-bottom: 20px; }
  #tela-historico .calendar-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
  #tela-historico .month-selector { font-size: 16px; font-weight: bold; color: #FFFFFF; background: none; border: none; cursor: pointer; }
  #tela-historico .nav-arrows button { background: none; border: none; color: #A8A8B3; font-size: 18px; cursor: pointer; padding: 0 8px; }
  #tela-historico .nav-arrows button:hover { color: #FF6C22; }

  #tela-historico .weekdays-grid,
  #tela-historico .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); text-align: center; }
  #tela-historico .weekdays-grid { color: #7C7C8A; font-size: 12px; font-weight: bold; margin-bottom: 12px; }

  #tela-historico .day { background: none; border: none; color: #7C7C8A; font-size: 14px; height: 40px; display: flex; align-items: center; justify-content: center; cursor: pointer; position: relative; margin: 4px 0; z-index: 1; font-family: inherit; }
  #tela-historico .day.has-workout { color: #FF6C22; font-weight: bold; }
  #tela-historico .day.disabled { color: #3A3A40 !important; cursor: not-allowed !important; pointer-events: none; }

  #tela-historico .day.range-single { background-color: #FF6C22 !important; color: #121214 !important; font-weight: bold !important; border-radius: 50%; }
  #tela-historico .day.range-start { background-color: #FF6C22 !important; color: #121214 !important; font-weight: bold !important; border-top-left-radius: 20px; border-bottom-left-radius: 20px; border-top-right-radius: 0; border-bottom-right-radius: 0; }

  /* ==================================================== */

<script>
  /* ============================================================ */
  /* ===========  FIREBASE: LOGIN + SINCRONIZAÇÃO NA NUVEM  ======= */
  /* ============================================================ */
  /* Antes de rodar o app, verificamos se o usuário está logado.    */
  /* Se estiver, buscamos os dados salvos na nuvem (Firestore) e    */
  /* colocamos no localStorage deste aparelho ANTES do app iniciar, */
  /* garantindo que o histórico apareça igual em qualquer celular.  */

  // 1) SUBSTITUA os valores abaixo pelos dados do SEU projeto Firebase
  //    (Console do Firebase > Configurações do projeto > Seus apps > SDK).
  const firebaseConfig = {
    apiKey: "AIzaSyCBGVssoMXUf0C_NZziTiIDPn2TyxE3_3s",
    authDomain: "treino-a090c.firebaseapp.com",
    projectId: "treino-a090c",
    storageBucket: "treino-a090c.firebasestorage.app",
    messagingSenderId: "220079472298",
    appId: "1:220079472298:web:7fef63a0cafd43f098dad3",
    measurementId: "G-6RR5EY55PL"
  };

  firebase.initializeApp(firebaseConfig);
  const auth = firebase.auth();
  const db = firebase.firestore();
  window.firebaseAuth = auth;
  window.firebaseDB = db;

  // Chaves do localStorage que representam dados do usuário e que
  // precisam ser sincronizadas entre aparelhos.
  const CHAVES_SINCRONIZADAS = [
    'app_achievement_stats',
    'app_profile_data',
    'workout_db',
    'custom_muscles',
    'workout_history_db',
    'workout_last_date'
  ];

  const authLoadingEl = document.getElementById('auth-loading');
  const authLoadingTextEl = document.getElementById('auth-loading-text');
  const authOverlayEl = document.getElementById('auth-overlay');
  const deviceRootEl = document.getElementById('device-root');
  const authForm = document.getElementById('auth-form');
  const authEmailInput = document.getElementById('auth-email');
  const authPasswordInput = document.getElementById('auth-password');
  const authConfirmField = document.getElementById('auth-confirm-field');
  const authConfirmInput = document.getElementById('auth-password-confirm');
  const authSubmitBtn = document.getElementById('auth-submit-btn');
  const authErrorEl = document.getElementById('auth-error');
  const authToggleLink = document.getElementById('auth-toggle-link');
  const authToggleText = document.getElementById('auth-toggle-text');
  const authSubtitleEl = document.getElementById('auth-subtitle');
  const authForgotLink = document.getElementById('auth-forgot-link');

  function configurarOlhoSenha(botaoId, inputEl) {
    const botao = document.getElementById(botaoId);
    if (!botao || !inputEl) return;
    botao.addEventListener('click', () => {
      const mostrando = inputEl.type === 'text';
      inputEl.type = mostrando ? 'password' : 'text';
      botao.classList.toggle('showing', !mostrando);
      botao.setAttribute('aria-label', mostrando ? 'Mostrar senha' : 'Ocultar senha');
    });
  }
  configurarOlhoSenha('auth-password-eye', authPasswordInput);
  configurarOlhoSenha('auth-password-confirm-eye', authConfirmInput);

  let modoCadastro = false;
  let appJaIniciado = false;
  let sincronizacaoAtiva = false; // só liga o envio pra nuvem depois que os dados iniciais já foram restaurados

  function mostrarErroAuth(msg) {
    authErrorEl.textContent = msg;
    authErrorEl.classList.add('show');
  }
  function limparErroAuth() {
    authErrorEl.classList.remove('show');
    authErrorEl.textContent = '';
  }
  function traduzirErroFirebase(err) {
    const codigo = err && err.code ? err.code : '';
    const mapa = {
      'auth/invalid-email': 'E-mail inválido.',
      'auth/user-disabled': 'Esta conta foi desativada.',
      'auth/user-not-found': 'E-mail ou senha incorretos.',
      'auth/wrong-password': 'E-mail ou senha incorretos.',
      'auth/invalid-credential': 'E-mail ou senha incorretos.',
      'auth/email-already-in-use': 'Já existe uma conta com este e-mail. Tente entrar.',
      'auth/weak-password': 'A senha precisa ter pelo menos 6 caracteres.',
      'auth/too-many-requests': 'Muitas tentativas. Aguarde um momento e tente de novo.',
      'auth/network-request-failed': 'Falha de conexão. Verifique sua internet.',
      'auth/requires-recent-login': 'Por segurança, confirme sua senha atual novamente.'
    };
    return mapa[codigo] || 'Não foi possível concluir. Tente novamente.';
  }

  authToggleLink.addEventListener('click', () => {
    modoCadastro = !modoCadastro;
    limparErroAuth();
    if (modoCadastro) {
      authSubmitBtn.textContent = 'Criar conta';
      authToggleText.textContent = 'Já tem conta?';
      authToggleLink.textContent = 'Entrar';
      authSubtitleEl.textContent = 'Crie sua conta para salvar seus treinos e acessá-los em qualquer aparelho.';
      authConfirmField.classList.remove('hidden');
      authConfirmInput.required = true;
      authForgotLink.style.display = 'none';
    } else {
      authSubmitBtn.textContent = 'Entrar';
      authToggleText.textContent = 'Não tem conta?';
      authToggleLink.textContent = 'Criar conta';
      authSubtitleEl.textContent = 'Entre com seu e-mail e senha para acessar seus treinos em qualquer aparelho.';
      authConfirmField.classList.add('hidden');
      authConfirmInput.required = false;
      authForgotLink.style.display = 'block';
    }
  });

  authForgotLink.addEventListener('click', () => {
    limparErroAuth();
    const email = authEmailInput.value.trim();
    if (!email) { mostrarErroAuth('Digite seu e-mail acima e toque em "Esqueci minha senha" novamente.'); return; }
    auth.sendPasswordResetEmail(email)
      .then(() => mostrarErroAuth('Enviamos um link de redefinição de senha para o seu e-mail.'))
      .catch(err => mostrarErroAuth(traduzirErroFirebase(err)));
  });

  authForm.addEventListener('submit', (e) => {
    e.preventDefault();
    limparErroAuth();
    const email = authEmailInput.value.trim();
    const senha = authPasswordInput.value;

    if (modoCadastro && senha !== authConfirmInput.value) {
      mostrarErroAuth('As senhas não coincidem.');
      return;
    }

    authSubmitBtn.disabled = true;
    authSubmitBtn.textContent = modoCadastro ? 'Criando conta...' : 'Entrando...';

    const acao = modoCadastro
      ? auth.createUserWithEmailAndPassword(email, senha)
      : auth.signInWithEmailAndPassword(email, senha);

    acao.catch(err => {
      mostrarErroAuth(traduzirErroFirebase(err));
      authSubmitBtn.disabled = false;
      authSubmitBtn.textContent = modoCadastro ? 'Criar conta' : 'Entrar';
    });
  });

  // Lê todos os dados relevantes deste aparelho (localStorage) e devolve um objeto simples
  function coletarDadosLocais() {
    const dados = {};
    CHAVES_SINCRONIZADAS.forEach(chave => {
      const valor = localStorage.getItem(chave);
      if (valor !== null) dados[chave] = valor;
    });
    return dados;
  }

  // Envia os dados atuais do aparelho para o Firestore (documento do usuário logado)
  let timeoutSincronizacao = null;
  function agendarSincronizacaoNuvem() {
    if (!sincronizacaoAtiva || !auth.currentUser) return;
    clearTimeout(timeoutSincronizacao);
    timeoutSincronizacao = setTimeout(() => {
      const dados = coletarDadosLocais();
      dados.atualizadoEm = firebase.firestore.FieldValue.serverTimestamp();
      db.collection('usuarios').doc(auth.currentUser.uid).set(dados, { merge: true })
        .catch(err => console.error('Erro ao sincronizar com a nuvem:', err));
    }, 1200);
  }

  // Sobrescreve o localStorage.setItem para, sempre que o app salvar algo,
  // também mandarmos essa informação para a nuvem (com um pequeno atraso,
  // para não gerar uma gravação por tecla digitada).
  const _localStorageSetItemOriginal = localStorage.setItem.bind(localStorage);
  localStorage.setItem = function(chave, valor) {
    _localStorageSetItemOriginal(chave, valor);
    if (CHAVES_SINCRONIZADAS.includes(chave)) agendarSincronizacaoNuvem();
  };

  // Limpa o documento do usuário na nuvem (usado no botão "Apagar todos os dados")
  window.limparDadosNaNuvem = function() {
    if (!auth.currentUser) return Promise.resolve();
    return db.collection('usuarios').doc(auth.currentUser.uid).delete().catch(() => {});
  };

  window.sairDaConta = function() {
    sincronizacaoAtiva = false;
    auth.signOut().then(() => location.reload());
  };

  function mostrarMsgConta(tipo, texto) {
    const erroEl = document.getElementById('account-edit-error');
    const okEl = document.getElementById('account-edit-success');
    if (erroEl) { erroEl.style.display = 'none'; erroEl.textContent = ''; }
    if (okEl) { okEl.style.display = 'none'; okEl.textContent = ''; }
    if (tipo === 'erro' && erroEl) { erroEl.textContent = texto; erroEl.style.display = 'block'; }
    if (tipo === 'ok' && okEl) { okEl.textContent = texto; okEl.style.display = 'block'; }
  }

  function reautenticarComSenhaAtual(senhaAtual) {
    const usuario = auth.currentUser;
    const credencial = firebase.auth.EmailAuthProvider.credential(usuario.email, senhaAtual);
    return usuario.reauthenticateWithCredential(credencial);
  }

  function atualizarEmailConta() {
    const senhaAtual = document.getElementById('account-current-password').value;
    const novoEmail = document.getElementById('account-new-email').value.trim();
    if (!senhaAtual) { mostrarMsgConta('erro', 'Digite sua senha atual para confirmar.'); return; }
    if (!novoEmail) { mostrarMsgConta('erro', 'Digite o novo e-mail.'); return; }

    reautenticarComSenhaAtual(senhaAtual)
      .then(() => {
        const usuario = auth.currentUser;
        if (typeof usuario.verifyBeforeUpdateEmail === 'function') {
          return usuario.verifyBeforeUpdateEmail(novoEmail);
        }
        return usuario.updateEmail(novoEmail);
      })
      .then(() => {
        mostrarMsgConta('ok', 'Enviamos um link de confirmação para o novo e-mail. Verifique a caixa de entrada para concluir a troca.');
        document.getElementById('account-current-password').value = '';
        document.getElementById('account-new-email').value = '';
      })
      .catch(err => mostrarMsgConta('erro', traduzirErroFirebase(err)));
  }

  function atualizarSenhaConta() {
    const senhaAtual = document.getElementById('account-current-password').value;
    const novaSenha = document.getElementById('account-new-password').value;
    if (!senhaAtual) { mostrarMsgConta('erro', 'Digite sua senha atual para confirmar.'); return; }
    if (!novaSenha || novaSenha.length < 6) { mostrarMsgConta('erro', 'A nova senha precisa ter pelo menos 6 caracteres.'); return; }

    reautenticarComSenhaAtual(senhaAtual)
      .then(() => auth.currentUser.updatePassword(novaSenha))
      .then(() => {
        mostrarMsgConta('ok', 'Senha atualizada com sucesso.');
        document.getElementById('account-current-password').value = '';
        document.getElementById('account-new-password').value = '';
      })
      .catch(err => mostrarMsgConta('erro', traduzirErroFirebase(err)));
  }

  document.addEventListener('click', (e) => {
    if (e.target && e.target.id === 'open-logout-confirm-btn') {
      if (confirm('Deseja sair da sua conta neste aparelho?')) {
        window.sairDaConta();
      }
    }
    if (e.target && e.target.id === 'open-settings-modal-btn') {
      const emailDisplayEl = document.getElementById('display-account-email');
      if (emailDisplayEl && auth.currentUser) emailDisplayEl.textContent = auth.currentUser.email || '—';
    }
    if (e.target && e.target.id === 'account-update-email-btn') {
      atualizarEmailConta();
    }
    if (e.target && e.target.id === 'account-update-password-btn') {
      atualizarSenhaConta();
    }
  });

  // Pega o script principal do app (guardado como texto inerte) e executa de
  // verdade, agora que já garantimos que os dados corretos estão no localStorage.
  function iniciarAppPrincipal() {
    if (appJaIniciado) return;
    appJaIniciado = true;
    sincronizacaoAtiva = true;
    authLoadingEl.classList.add('hidden');
    authOverlayEl.classList.add('hidden');
    deviceRootEl.style.display = '';

    const scriptInerte = document.getElementById('app-main-script');
    const novoScript = document.createElement('script');
    novoScript.text = scriptInerte.textContent;
    document.body.appendChild(novoScript);

    verificarPerfilObrigatorio();
  }

  // Garante que o usuário preencha nome, nascimento, altura, nível, meta,
  // peso atual e peso foco logo após criar a conta (ou em qualquer login
  // enquanto algum desses dados não estiver completo). Enquanto isso, o
  // modal correspondente fica travado (sem botão de fechar) por cima do app.
  function verificarPerfilObrigatorio() {
    try {
      const bruto = localStorage.getItem('app_profile_data');
      const dados = bruto ? JSON.parse(bruto) : {};
      const perfilCompleto = !!(dados && dados.nome && dados.nascimento && dados.altura && dados.nivel && dados.meta);
      const pesoCompleto = dados && dados.pesoAtual !== null && dados.pesoAtual !== undefined;
      const pesoFocoCompleto = dados && dados.pesoFoco !== null && dados.pesoFoco !== undefined;

      if (perfilCompleto && pesoCompleto && pesoFocoCompleto) return;

      if (typeof mudarAba === 'function') {
        const navPerfil = document.querySelector('.nav-item[onclick*="Perfil"]');
        if (navPerfil) mudarAba(navPerfil, 'Perfil');
      }

      if (!perfilCompleto) {
        travarModalObrigatorio('open-modal-btn', 'profile-form', 'close-modal-btn', 'edit-modal-mandatory-note');
      } else if (!pesoCompleto) {
        travarModalObrigatorio('open-weight-modal-btn', 'weight-form', 'close-weight-modal-btn', 'weight-modal-mandatory-note');
      } else if (!pesoFocoCompleto) {
        travarModalObrigatorio('open-target-weight-modal-btn', 'target-weight-form', 'close-target-weight-modal-btn', 'target-weight-modal-mandatory-note');
      }
    } catch (err) {
      console.error('Erro ao verificar perfil obrigatório:', err);
    }
  }

  // Abre o modal indicado (clicando no botão real, pra reaproveitar toda a
  // lógica original de preenchimento) e o mantém travado até o envio do
  // formulário, quando então avança pra próxima exigência pendente (se houver).
  function travarModalObrigatorio(openBtnId, formId, closeBtnId, avisoId) {
    const openBtn = document.getElementById(openBtnId);
    const form = document.getElementById(formId);
    const closeBtn = document.getElementById(closeBtnId);
    const aviso = document.getElementById(avisoId);
    if (!openBtn || !form) return;

    openBtn.click();
    if (closeBtn) closeBtn.style.display = 'none';
    if (aviso) aviso.style.display = 'block';

    form.addEventListener('submit', function() {
      if (closeBtn) closeBtn.style.display = '';
      if (aviso) aviso.style.display = 'none';
      setTimeout(verificarPerfilObrigatorio, 100);
    }, { once: true });
  }

  auth.onAuthStateChanged((usuario) => {
    if (!usuario) {
      appJaIniciado = false;
      sincronizacaoAtiva = false;
      authLoadingEl.classList.add('hidden');
      deviceRootEl.style.display = 'none';
      authOverlayEl.classList.remove('hidden');
      return;
    }

    authOverlayEl.classList.add('hidden');
    authLoadingEl.classList.remove('hidden');
    authLoadingTextEl.textContent = 'Carregando seus dados...';
    const emailDisplayEl = document.getElementById('display-account-email');
    if (emailDisplayEl) emailDisplayEl.textContent = usuario.email || '—';

    db.collection('usuarios').doc(usuario.uid).get()
      .then(doc => {
        if (doc.exists) {
          // Já existem dados desta conta na nuvem (ex.: outro aparelho já usou o app).
          // Eles têm prioridade e substituem o que estiver salvo neste aparelho.
          const dados = doc.data();
          CHAVES_SINCRONIZADAS.forEach(chave => {
            if (dados[chave] !== undefined) {
              _localStorageSetItemOriginal(chave, dados[chave]);
            }
          });
        } else {
          // Primeira vez que esta conta sincroniza: se já houver dados
          // salvos neste aparelho (uso antes de criar a conta), enviamos
          // para a nuvem em vez de apagá-los.
          const dadosLocaisExistentes = coletarDadosLocais();
          if (Object.keys(dadosLocaisExistentes).length > 0) {
            dadosLocaisExistentes.atualizadoEm = firebase.firestore.FieldValue.serverTimestamp();
            db.collection('usuarios').doc(usuario.uid).set(dadosLocaisExistentes, { merge: true }).catch(() => {});
          }
        }
      })
      .catch(err => {
        console.error('Erro ao buscar dados na nuvem, continuando com os dados deste aparelho:', err);
      })
      .finally(() => {
        iniciarAppPrincipal();
      });
  });

</script>

<!-- O script abaixo é o app inteiro, mas fica "inerte" (type="text/plain",
     o navegador não executa) até o login ser confirmado e os dados da nuvem
     serem carregados no localStorage. Só então ele é injetado e executado
     de verdade pela função iniciarAppPrincipal() acima. -->
<script type="text/plain" id="app-main-script">
  /* ============================================================ */
  /* ============  MOTOR DE ESTATÍSTICAS / CONQUISTAS  =========== */
  /* ============================================================ */
  /* Centraliza os dados que alimentam a tela de Conquistas,       */
  /* lidos e gravados a partir das telas de Exercícios e Perfil.   */

  const ACHIEVEMENTS_STORAGE_KEY = 'app_achievement_stats';

  function getStats() {
    const defaults = {
      exerciciosTotal: 0,
      exerciciosPorMusculo: { peito: 0, costas: 0, biceps: 0, triceps: 0, ombro: 0, pernas: 0 },
      diasTreinados: [],
      pesoInicial: null,
      pesoAtual: null,
      conquistasVistas: [],
      diario: {},
      fotosPorData: {},
      conquistasPorData: {},
      exerciciosComCargaAumentada: []
    };
    try {
      const salvo = JSON.parse(localStorage.getItem(ACHIEVEMENTS_STORAGE_KEY));
      if (!salvo) return defaults;
      return Object.assign({}, defaults, salvo, {
        exerciciosPorMusculo: Object.assign({}, defaults.exerciciosPorMusculo, salvo.exerciciosPorMusculo || {}),
        conquistasVistas: Array.isArray(salvo.conquistasVistas) ? salvo.conquistasVistas : [],
        diario: salvo.diario || {},
        fotosPorData: salvo.fotosPorData || {},
        conquistasPorData: salvo.conquistasPorData || {},
        exerciciosComCargaAumentada: Array.isArray(salvo.exerciciosComCargaAumentada) ? salvo.exerciciosComCargaAumentada : []
      });
    } catch (e) {
      return defaults;
    }
  }

  function hojeChaveData() {
    const hoje = new Date();
    return `${hoje.getFullYear()}-${String(hoje.getMonth() + 1).padStart(2, '0')}-${String(hoje.getDate()).padStart(2, '0')}`;
  }

  // Procura em qual data uma conquista específica foi desbloqueada
  function obterDataDesbloqueioConquista(id, stats) {
    if (!stats.conquistasPorData) return null;
    for (const data in stats.conquistasPorData) {
      if (stats.conquistasPorData[data].includes(id)) return data;
    }
    return null;
  }

  // Converte 'YYYY-MM-DD' para 'DD/MM/AAAA'
  function formatarDataBR(dataStr) {
    const [ano, mes, dia] = dataStr.split('-');
    return `${dia}/${mes}/${ano}`;
  }

  // Chamado sempre que uma nova foto de evolução é salva na tela de Perfil
  function registrarFotoEvolucao(tipoFoto) {
    const stats = getStats();
    const hojeStr = hojeChaveData();
    if (!stats.fotosPorData[hojeStr]) stats.fotosPorData[hojeStr] = [];
    stats.fotosPorData[hojeStr].push({ tipo: tipoFoto });
    saveStats(stats);
    checarNovasConquistas();
  }

  // Chamado sempre que a carga (peso) de um exercício é aumentada na tela de Exercícios
  function registrarAumentoCarga(exerciseId) {
    const stats = getStats();
    if (!Array.isArray(stats.exerciciosComCargaAumentada)) stats.exerciciosComCargaAumentada = [];
    if (!stats.exerciciosComCargaAumentada.includes(exerciseId)) {
      stats.exerciciosComCargaAumentada.push(exerciseId);
      saveStats(stats);
      checarNovasConquistas();
    }
  }

  function saveStats(stats) {
    localStorage.setItem(ACHIEVEMENTS_STORAGE_KEY, JSON.stringify(stats));
  }

  function normalizarMusculo(m) {
    const mapa = {
      'peito': 'peito',
      'costa': 'costas', 'costas': 'costas',
      'bíceps': 'biceps', 'biceps': 'biceps',
      'tríceps': 'triceps', 'triceps': 'triceps',
      'ombro': 'ombro',
      'pernas': 'pernas'
    };
    return mapa[(m || '').toLowerCase()] || null;
  }

  // Chamado sempre que um exercício é concluído na tela de Exercícios
  function registrarExercicioConcluido(muscleRaw) {
    const stats = getStats();
    stats.exerciciosTotal++;
    const musculo = normalizarMusculo(muscleRaw);
    if (musculo && Object.prototype.hasOwnProperty.call(stats.exerciciosPorMusculo, musculo)) {
      stats.exerciciosPorMusculo[musculo]++;
    }
    const hoje = new Date();
    const hojeStr = `${hoje.getFullYear()}-${String(hoje.getMonth() + 1).padStart(2, '0')}-${String(hoje.getDate()).padStart(2, '0')}`;
    if (!stats.diasTreinados.includes(hojeStr)) {
      stats.diasTreinados.push(hojeStr);
    }
    if (!stats.diario[hojeStr]) stats.diario[hojeStr] = {};
    if (musculo) {
      stats.diario[hojeStr][musculo] = (stats.diario[hojeStr][musculo] || 0) + 1;
    }
    saveStats(stats);
    checarNovasConquistas();
  }

  // Chamado sempre que o peso é atualizado na tela de Perfil
  function registrarPeso(novoPeso) {
    const stats = getStats();
    if (stats.pesoInicial === null || stats.pesoInicial === undefined) {
      stats.pesoInicial = novoPeso;
    }
    stats.pesoAtual = novoPeso;
    saveStats(stats);
    checarNovasConquistas();
  }

  function calcularDiasConsecutivos(diasTreinados) {
    if (!diasTreinados || diasTreinados.length === 0) return 0;
    const umDia = 24 * 60 * 60 * 1000;
    const setDatas = new Set(diasTreinados.map(d => {
      const [y, m, dd] = d.split('-').map(Number);
      return new Date(y, m - 1, dd).getTime();
    }));
    const hoje = new Date(); hoje.setHours(0, 0, 0, 0);
    let cursor = hoje.getTime();
    // Se hoje ainda não treinou, a sequência conta a partir de ontem
    if (!setDatas.has(cursor)) cursor -= umDia;
    let streak = 0;
    while (setDatas.has(cursor)) {
      streak++;
      cursor -= umDia;
    }
    return streak;
  }

  // Verifica se, no mês atual, o usuário treinou pelo menos `minDiasSemana` dias
  // em CADA semana já iniciada (e cada semana já iniciada precisa estar totalmente
  // encerrada, exceto a semana atual, que só conta se já tiver cumprido a meta)
  function treinouTodasSemanasDoMes(diasTreinados, minDiasSemana = 1) {
    const hoje = new Date();
    const ano = hoje.getFullYear();
    const mes = hoje.getMonth();
    const diasDoMes = new Date(ano, mes + 1, 0).getDate();
    const prefixoMes = `${ano}-${String(mes + 1).padStart(2, '0')}`;
    const diasTreinadosSet = new Set((diasTreinados || []).filter(d => d.startsWith(prefixoMes)));
    const hojeZerado = new Date(ano, mes, hoje.getDate()).getTime();

    // Agrupa os dias do mês em semanas de calendário (domingo a sábado)
    const semanas = [];
    let semanaAtual = [];
    for (let dia = 1; dia <= diasDoMes; dia++) {
      const data = new Date(ano, mes, dia);
      semanaAtual.push(data);
      if (data.getDay() === 6 || dia === diasDoMes) {
        semanas.push(semanaAtual);
        semanaAtual = [];
      }
    }

    // Só considera semanas que já começaram até hoje
    const semanasRelevantes = semanas.filter(semana => semana[0].getTime() <= hojeZerado);
    if (semanasRelevantes.length === 0) return false;

    return semanasRelevantes.every(semana => {
      const diasTreinadosNaSemana = semana.filter(data => {
        const str = `${data.getFullYear()}-${String(data.getMonth() + 1).padStart(2, '0')}-${String(data.getDate()).padStart(2, '0')}`;
        return diasTreinadosSet.has(str);
      }).length;
      return diasTreinadosNaSemana >= minDiasSemana;
    });
  }

  // Soma o total de fotos de evolução já publicadas
  function totalFotosEvolucao(fotosPorData) {
    if (!fotosPorData) return 0;
    return Object.values(fotosPorData).reduce((soma, lista) => soma + (Array.isArray(lista) ? lista.length : 0), 0);
  }

  // Compara o primeiro e o último registro de medidas de cada músculo e
  // devolve quantos cm foram ganhos em cada um (nunca menor que 0)
  function calcularGanhosDeMedidas() {
    const medidasChaves = ['ombro', 'peito', 'costas', 'biceps', 'triceps', 'cintura', 'coxa', 'panturrilha'];
    const ganhos = {};
    medidasChaves.forEach(chave => ganhos[chave] = 0);

    const profileData = getProfileData();
    const historico = profileData.historicoDeMedidasRegistradas || [];
    if (historico.length < 2) return ganhos;

    medidasChaves.forEach(chave => {
      let primeiro = null, ultimo = null;
      historico.forEach(registro => {
        const valor = registro.valores ? registro.valores[chave] : null;
        if (valor !== null && valor !== undefined) {
          if (primeiro === null) primeiro = valor;
          ultimo = valor;
        }
      });
      if (primeiro !== null && ultimo !== null) {
        ganhos[chave] = Math.max(0, ultimo - primeiro);
      }
    });
    return ganhos;
  }

  // Verifica se a meta principal escolhida no perfil permite essa conquista
  // (ex: conquistas de "perder peso" só valem se a meta for "Emagrecer";
  // conquistas de "ganhar peso" só valem se a meta for "Ganhar massa" ou "Definição")
  function metaPermiteConquista(cfg) {
    if (!cfg || !cfg.metaReq) return true;
    const profileData = getProfileData();
    return cfg.metaReq.includes(profileData.meta);
  }

  // Calcula o progresso atual de uma conquista a partir das estatísticas
  function calcularProgressoConquista(id, stats, diasConsecutivos) {
    const cfg = ACHIEVEMENTS_CONFIG[id];
    if (!cfg) return { atual: 0, atingiu: false };
    if (!metaPermiteConquista(cfg)) return { atual: 0, atingiu: false, indisponivel: true };
    let atual = 0;
    if (cfg.tipo === 'peso_perdido') {
      if (stats.pesoInicial !== null && stats.pesoAtual !== null) atual = Math.max(0, stats.pesoInicial - stats.pesoAtual);
    } else if (cfg.tipo === 'peso_ganho') {
      if (stats.pesoInicial !== null && stats.pesoAtual !== null) atual = Math.max(0, stats.pesoAtual - stats.pesoInicial);
    } else if (cfg.tipo === 'exercicios_total') {
      atual = stats.exerciciosTotal;
    } else if (cfg.tipo === 'exercicios_musculo') {
      atual = stats.exerciciosPorMusculo[cfg.musculo] || 0;
    } else if (cfg.tipo === 'dias_treinados') {
      atual = stats.diasTreinados.length;
    } else if (cfg.tipo === 'dias_consecutivos') {
      atual = diasConsecutivos;
    } else if (cfg.tipo === 'carga_aumentada') {
      atual = (stats.exerciciosComCargaAumentada || []).length;
    } else if (cfg.tipo === 'semanas_mes') {
      atual = treinouTodasSemanasDoMes(stats.diasTreinados, cfg.minDiasSemana || 1) ? 1 : 0;
    } else if (cfg.tipo === 'fotos_evolucao') {
      atual = totalFotosEvolucao(stats.fotosPorData);
    } else if (cfg.tipo === 'medidas_todos_1cm') {
      const ganhos = calcularGanhosDeMedidas();
      atual = Object.values(ganhos).filter(g => g >= 1).length;
    } else if (cfg.tipo === 'medidas_3musculos_3cm') {
      const ganhos = calcularGanhosDeMedidas();
      atual = Object.values(ganhos).filter(g => g >= 3).length;
    }
    return { atual: Math.min(atual, cfg.meta), atingiu: atual >= cfg.meta };
  }

  let filaNotificacaoConquistas = [];

  function mostrarProximaConquistaNaFila() {
    const overlay = document.getElementById('achievementUnlockOverlay');
    if (!overlay || overlay.classList.contains('active')) return;
    const id = filaNotificacaoConquistas.shift();
    if (!id) return;
    const info = ACHIEVEMENT_LABELS[id] || { titulo: 'Conquista desbloqueada', desc: '' };
    document.getElementById('achievementUnlockTitle').textContent = info.titulo;
    document.getElementById('achievementUnlockDesc').textContent = info.desc;
    const unlockImg = document.getElementById('achievementUnlockImg');
    if (unlockImg && ACHIEVEMENT_IMAGES[id]) unlockImg.src = ACHIEVEMENT_IMAGES[id];
    overlay.classList.add('active');
  }

    achievementUnlockCloseBtn.addEventListener('click', () => {
      document.getElementById('achievementUnlockOverlay').classList.remove('active');
      setTimeout(mostrarProximaConquistaNaFila, 350);
    });

  // Compara o progresso atual com o que já foi visto antes e enfileira as conquistas novas
  function checarNovasConquistas() {
    const stats = getStats();
    if (!Array.isArray(stats.conquistasVistas)) stats.conquistasVistas = [];
    const diasConsecutivos = calcularDiasConsecutivos(stats.diasTreinados);
    let mudou = false;

    if (!stats.conquistasPorData) stats.conquistasPorData = {};
    const hojeStr = hojeChaveData();

    Object.keys(ACHIEVEMENTS_CONFIG).forEach(id => {
      const { atingiu } = calcularProgressoConquista(id, stats, diasConsecutivos);
      if (atingiu && !stats.conquistasVistas.includes(id)) {
        stats.conquistasVistas.push(id);
        filaNotificacaoConquistas.push(id);
        if (!stats.conquistasPorData[hojeStr]) stats.conquistasPorData[hojeStr] = [];
        stats.conquistasPorData[hojeStr].push(id);
        mudou = true;
      }
    });

    if (mudou) {
      saveStats(stats);
      mostrarProximaConquistaNaFila();
    }
  }

  // Lê as estatísticas reais e atualiza cada card da tela de Conquistas
  function atualizarConquistas() {
    const stats = getStats();
    const diasConsecutivos = calcularDiasConsecutivos(stats.diasTreinados);

    let totalDisponiveis = 0;
    let totalDesbloqueadas = 0;

    document.querySelectorAll('#tela-conquistas .achievement-card[data-achievement]').forEach(card => {
      const id = card.getAttribute('data-achievement');
      const cfg = ACHIEVEMENTS_CONFIG[id];
      if (!cfg) return;

      const permitido = metaPermiteConquista(cfg);

      let atual = 0;
      if (!permitido) {
        atual = 0;
      } else if (cfg.tipo === 'peso_perdido') {
        if (stats.pesoInicial !== null && stats.pesoAtual !== null) atual = Math.max(0, stats.pesoInicial - stats.pesoAtual);
      } else if (cfg.tipo === 'peso_ganho') {
        if (stats.pesoInicial !== null && stats.pesoAtual !== null) atual = Math.max(0, stats.pesoAtual - stats.pesoInicial);
      } else if (cfg.tipo === 'exercicios_total') {
        atual = stats.exerciciosTotal;
      } else if (cfg.tipo === 'exercicios_musculo') {
        atual = stats.exerciciosPorMusculo[cfg.musculo] || 0;
      } else if (cfg.tipo === 'dias_treinados') {
        atual = stats.diasTreinados.length;
      } else if (cfg.tipo === 'dias_consecutivos') {
        atual = diasConsecutivos;
      } else if (cfg.tipo === 'carga_aumentada') {
        atual = (stats.exerciciosComCargaAumentada || []).length;
      } else if (cfg.tipo === 'semanas_mes') {
        atual = treinouTodasSemanasDoMes(stats.diasTreinados, cfg.minDiasSemana || 1) ? 1 : 0;
      } else if (cfg.tipo === 'fotos_evolucao') {
        atual = totalFotosEvolucao(stats.fotosPorData);
      } else if (cfg.tipo === 'medidas_todos_1cm') {
        const ganhos = calcularGanhosDeMedidas();
        atual = Object.values(ganhos).filter(g => g >= 1).length;
      } else if (cfg.tipo === 'medidas_3musculos_3cm') {
        const ganhos = calcularGanhosDeMedidas();
        atual = Object.values(ganhos).filter(g => g >= 3).length;
      }

      atual = Math.min(atual, cfg.meta);
      const atingiu = permitido && atual >= cfg.meta;
      card.classList.toggle('unlocked', atingiu);
      card.classList.toggle('locked', !atingiu);
      card.classList.toggle('indisponivel', !permitido);
      card.style.display = permitido ? '' : 'none';

      if (permitido) {
        totalDisponiveis++;
        if (atingiu) totalDesbloqueadas++;
      }

      const img = card.querySelector('.medal-badge');
      if (img && ACHIEVEMENT_IMAGES[id]) img.src = ACHIEVEMENT_IMAGES[id];

      card.onclick = () => abrirDetalheConquista(id);

      const bar = card.querySelector('.progress-bar');
      const text = card.querySelector('.progress-text');
      const pct = permitido ? Math.min(100, Math.round((atual / cfg.meta) * 100)) : 0;
      if (bar) bar.style.width = pct + '%';
      if (text) {
        // Guarda o sufixo de unidade original (ex: "kg") uma única vez,
        // para não perdê-lo quando o texto for trocado pela mensagem de indisponibilidade
        if (text.dataset.sufixo === undefined) {
          const original = text.textContent;
          const sufixoMatch = original.match(/\/\s*[\d.,]+\s*(.*)$/);
          text.dataset.sufixo = sufixoMatch ? sufixoMatch[1].trim() : '';
        }
        const sufixo = text.dataset.sufixo;

        if (!permitido) {
          text.textContent = `Disponível para meta: ${cfg.metaReq.join(' ou ')}`;
        } else {
          const metaFormatada = cfg.meta.toLocaleString('pt-BR');
          const atualFormatado = cfg.unidade === 'kg'
            ? atual.toFixed(1).replace('.', ',')
            : Math.floor(atual).toLocaleString('pt-BR');
          text.textContent = `${atualFormatado} / ${metaFormatada}${sufixo ? ' ' + sufixo : ''}`;
        }
      }
    });

    // Atualiza a barra de progresso geral no topo, contando só as
    // conquistas disponíveis para a meta principal atual
    const overallBar = document.getElementById('conquistasProgressBar');
    const overallText = document.getElementById('conquistasProgressText');
    if (overallBar) {
      const overallPct = totalDisponiveis > 0 ? Math.round((totalDesbloqueadas / totalDisponiveis) * 100) : 0;
      overallBar.style.width = overallPct + '%';
    }
    if (overallText) {
      overallText.textContent = `${totalDesbloqueadas} / ${totalDisponiveis} conquistas`;
    }

    // Liga o botão de fechar do modal de detalhes (recriado a cada renderização da tela)
    const closeDetailBtn = document.getElementById('closeAchievementDetailBtn');
    const detailOverlay = document.getElementById('achievementDetailOverlay');
    if (closeDetailBtn && detailOverlay) {
      closeDetailBtn.onclick = () => detailOverlay.classList.remove('active');
      detailOverlay.onclick = (e) => { if (e.target === detailOverlay) detailOverlay.classList.remove('active'); };
    }
  }

  // Abre o modal com os detalhes de uma conquista (bloqueada ou desbloqueada)
  function abrirDetalheConquista(id) {
    const card = document.querySelector(`#tela-conquistas .achievement-card[data-achievement="${id}"]`);
    if (!card) return;
    const info = ACHIEVEMENT_LABELS[id] || { titulo: '', desc: '' };
    const atingiu = card.classList.contains('unlocked');

    const img = document.getElementById('achievementDetailImg');
    if (img) img.src = ACHIEVEMENT_IMAGES[id] || '';

    document.getElementById('achievementDetailTitle').textContent = info.titulo;
    document.getElementById('achievementDetailDesc').textContent = info.desc;

    const badgeWrap = document.getElementById('achievementDetailBadgeWrap');
    if (badgeWrap) badgeWrap.classList.toggle('locked', !atingiu);

    const cardBar = card.querySelector('.progress-bar');
    const cardText = card.querySelector('.progress-text');
    const bar = document.getElementById('achievementDetailBar');
    if (bar) {
      bar.style.width = cardBar ? cardBar.style.width : '0%';
      bar.style.background = atingiu ? '#22C55E' : 'var(--amber)';
    }
    const progressText = document.getElementById('achievementDetailProgressText');
    if (progressText) {
      progressText.textContent = cardText ? cardText.textContent : '';
      progressText.style.color = atingiu ? 'rgba(34, 197, 94, 0.7)' : '#55575C';
    }

    const dateEl = document.getElementById('achievementDetailDate');
    if (dateEl) {
      if (atingiu) {
        const stats = getStats();
        const dataStr = obterDataDesbloqueioConquista(id, stats);
        dateEl.textContent = dataStr ? `Desbloqueada em ${formatarDataBR(dataStr)}` : 'Conquista desbloqueada';
        dateEl.style.display = 'block';
      } else {
        dateEl.style.display = 'none';
      }
    }

    const overlay = document.getElementById('achievementDetailOverlay');
    if (overlay) overlay.classList.add('active');
  }

  /* ============================================================ */
  /* ============ PERSISTÊNCIA DOS DADOS DO PERFIL =============== */
  /* ============================================================ */
  /* Guarda tudo que é preenchido na tela de Perfil (dados         */
  /* pessoais, peso, medidas e fotos) para que continue disponível */
  /* ao sair e voltar para a aba, ou ao fechar e reabrir o app.    */

  const PROFILE_STORAGE_KEY = 'app_profile_data';

  function getProfileData() {
    const defaults = {
      nome: null,
      nascimento: null,
      altura: null,
      meta: null,
      nivel: null,
      membroDesde: null,
      pesoAtual: null,
      pesoFoco: null,
      mesInicialIndex: null,
      mesFinalIndex: null,
      dataMetaSalvaFormatada: null,
      registrosPesosHistorico: {},
      historicoPesosDetalhado: [],
      historicoDeMedidasRegistradas: [],
      fotos: {}
    };
    try {
      const salvo = JSON.parse(localStorage.getItem(PROFILE_STORAGE_KEY));
      if (!salvo) return defaults;
      return Object.assign({}, defaults, salvo, {
        registrosPesosHistorico: salvo.registrosPesosHistorico || {},
        historicoPesosDetalhado: Array.isArray(salvo.historicoPesosDetalhado) ? salvo.historicoPesosDetalhado : [],
        historicoDeMedidasRegistradas: Array.isArray(salvo.historicoDeMedidasRegistradas) ? salvo.historicoDeMedidasRegistradas : [],
        fotos: salvo.fotos || {}
      });
    } catch (e) {
      return defaults;
    }
  }

  function saveProfileData(data) {
    try {
      localStorage.setItem(PROFILE_STORAGE_KEY, JSON.stringify(data));
      return true;
    } catch (e) {
      console.error('Não foi possível salvar os dados do perfil (armazenamento cheio?)', e);
      return false;
    }
  }

  function mudarAba(elemento, nomeAba) {
    const itens = document.querySelectorAll('.nav-item');
    itens.forEach(item => item.classList.remove('active'));

    elemento.classList.add('active');

    const container = document.getElementById('main-content');
    container.innerHTML = '';

    if (nomeAba === 'Início') {
      carregarTelaInicio(container);
    } else if (nomeAba === 'Histórico') {
      carregarTelaHistorico(container);
    } else if (nomeAba === 'Exercícios') {
      carregarTelaExercicios(container);
    } else if (nomeAba === 'Conquistas') {
      carregarTelaConquistas(container);
    } else if (nomeAba === 'Perfil') {
      carregarTelaPerfil(container);
    }

    // Garante que a rolagem volte ao topo mesmo depois que imagens/gráficos
    // da nova aba terminarem de carregar e alterarem a altura do conteúdo.
    const deviceEl = document.querySelector('.device');
    if (deviceEl) {
      deviceEl.scrollTop = 0;
      requestAnimationFrame(() => { deviceEl.scrollTop = 0; });
      setTimeout(() => { deviceEl.scrollTop = 0; }, 150);
    }
  }

  function iniciarLogicaTelaInicio() {
    const phrases = [
      "Seu único concorrente é você mesmo.",
      "Cada treino te aproxima do seu objetivo.",
      "A disciplina vence a motivação.",
      "Não desista. Evolua um pouco a cada dia.",
      "Seu corpo reflete suas escolhas.",
      "A dor passa, os resultados ficam.",
      "Hoje é o dia de ficar mais forte.",
      "O progresso começa com o primeiro passo.",
      "Treine com foco, vença com atitude.",
      "Não espere resultados sem esforço.",
      "Transforme suor em conquistas.",
      "Constância supera intensidade.",
      "Seu futuro agradece o treino de hoje.",
      "Cada repetição conta.",
      "Você é mais forte do que imagina.",
      "O impossível é só o começo.",
      "Desafie seus limites diariamente.",
      "A melhor versão de você está em construção.",
      "Treine firme. Viva melhor.",
      "Não pare até sentir orgulho de si."
    ];

    const monthNames = [
      "JANEIRO", "FEVEREIRO", "MARÇO", "ABRIL", "MAIO", "JUNHO",
      "JULHO", "AGOSTO", "SETEMBRO", "OUTUBRO", "NOVEMBRO", "DEZEMBRO"
    ];

    const dowNamesShort = ["Dom", "Seg", "Ter", "Qua", "Qui", "Sex", "Sáb"];

    const realToday = new Date();
    let currentWeekStart = getMondayOfDate(new Date(realToday));

    const dayStrip = document.getElementById('dayStrip');
    const calendarMonthLabel = document.getElementById('calendarMonth');
    const quoteTextElement = document.getElementById('quoteText');
    const prevWeekBtn = document.getElementById('prevWeekBtn');
    const nextWeekBtn = document.getElementById('nextWeekBtn');
    const muscleBarsList = document.getElementById('muscleBarsList');
    const statDiasTreinadosEl = document.getElementById('statDiasTreinados');
    const statMusculosTrabalhandoEl = document.getElementById('statMusculosTrabalhando');
    const homeHistoryList = document.getElementById('homeHistoryList');

    let activeSelectedDate = new Date(realToday);

    const MUSCLE_LABELS = { peito: 'Peito', costas: 'Costas', biceps: 'Bíceps', triceps: 'Tríceps', ombro: 'Ombros', pernas: 'Pernas/Glúteo' };

    function formatarDataChave(d) {
      return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
    }

    function juntarNomesMusculos(chaves) {
      const nomes = chaves.map(c => MUSCLE_LABELS[c] || c);
      if (nomes.length === 0) return 'Treino registrado';
      if (nomes.length === 1) return nomes[0];
      return nomes.slice(0, -1).join(', ') + ' e ' + nomes[nomes.length - 1];
    }

    function getMondayOfDate(d) {
      const date = new Date(d);
      const day = date.getDay();
      const diff = date.getDate() - day + (day === 0 ? -6 : 1);
      return new Date(date.setDate(diff));
    }

    function isFutureDate(d1, d2) {
      const checkDate = new Date(d1.getFullYear(), d1.getMonth(), d1.getDate());
      const referenceDate = new Date(d2.getFullYear(), d2.getMonth(), d2.getDate());
      return checkDate.getTime() > referenceDate.getTime();
    }

    function isSameDay(d1, d2) {
      return d1.getFullYear() === d2.getFullYear() &&
             d1.getMonth() === d2.getMonth() &&
             d1.getDate() === d2.getDate();
    }

    function getPhraseForDay(dayNumber) {
      const index = (dayNumber - 1) % phrases.length;
      return phrases[index];
    }

    function updateQuote(dayNumber) {
      quoteTextElement.textContent = getPhraseForDay(dayNumber);
    }

    function renderMuscleChart() {
      const currentYear = realToday.getFullYear();
      const currentMonth = realToday.getMonth();
      const stats = getStats();
      const diario = stats.diario || {};

      const totaisPorMusculo = {};
      Object.keys(diario).forEach(dataChave => {
        const [ano, mes] = dataChave.split('-').map(Number);
        if (ano !== currentYear || (mes - 1) !== currentMonth) return;
        const registrosDoDia = diario[dataChave] || {};
        Object.keys(registrosDoDia).forEach(musculo => {
          totaisPorMusculo[musculo] = (totaisPorMusculo[musculo] || 0) + registrosDoDia[musculo];
        });
      });

      const monthData = Object.keys(totaisPorMusculo).map(musculo => ({
        name: MUSCLE_LABELS[musculo] || musculo,
        count: totaisPorMusculo[musculo]
      }));

      muscleBarsList.innerHTML = "";

      if (monthData.length === 0) {
        muscleBarsList.innerHTML = `<div class="history-empty">Nenhum exercício registrado este mês ainda.</div>`;
        return;
      }

      monthData.sort((a, b) => b.count - a.count);
      const maxCount = Math.max(...monthData.map(item => item.count)) || 1;

      monthData.forEach(item => {
        const percentage = Math.round((item.count / maxCount) * 100);

        const barItem = document.createElement('div');
        barItem.className = "muscle-bar-item";
        barItem.innerHTML = `
          <div class="muscle-bar-info">
            <span class="muscle-bar-name">${item.name}</span>
            <span class="muscle-bar-value">${item.count} ex.</span>
          </div>
          <div class="muscle-bar-track">
            <div class="muscle-bar-fill" style="width: ${percentage}%;"></div>
          </div>
        `;
        muscleBarsList.appendChild(barItem);
      });
    }

    function renderResumoSemanal() {
      const stats = getStats();
      const diario = stats.diario || {};
      const diasComTreino = new Set();
      const musculosNaSemana = new Set();

      for (let i = 0; i < 7; i++) {
        const loopDate = new Date(currentWeekStart);
        loopDate.setDate(currentWeekStart.getDate() + i);
        const chave = formatarDataChave(loopDate);
        const registrosDoDia = diario[chave];
        if (registrosDoDia && Object.keys(registrosDoDia).length > 0) {
          diasComTreino.add(chave);
          Object.keys(registrosDoDia).forEach(m => musculosNaSemana.add(m));
        }
      }

      if (statDiasTreinadosEl) statDiasTreinadosEl.textContent = diasComTreino.size;
      if (statMusculosTrabalhandoEl) statMusculosTrabalhandoEl.textContent = musculosNaSemana.size;
    }

    function renderHomeHistoryList() {
      if (!homeHistoryList) return;
      const stats = getStats();
      const diario = stats.diario || {};

      const datasOrdenadas = Object.keys(diario)
        .filter(chave => diario[chave] && Object.keys(diario[chave]).length > 0)
        .sort((a, b) => b.localeCompare(a))
        .slice(0, 3);

      if (datasOrdenadas.length === 0) {
        homeHistoryList.innerHTML = `<div class="history-empty" id="homeHistoryEmpty">Nenhum treino registrado ainda. Comece hoje!</div>`;
        return;
      }

      homeHistoryList.innerHTML = datasOrdenadas.map(chave => {
        const [ano, mes, dia] = chave.split('-').map(Number);
        const dataObj = new Date(ano, mes - 1, dia);
        const nomeDia = dowNamesShort[dataObj.getDay()];
        const musculos = Object.keys(diario[chave]);
        const descricao = juntarNomesMusculos(musculos);
        return `
          <div class="history-item workout">
            <div class="history-date">
              <span class="day-num">${String(dia).padStart(2, '0')}</span>
              <span class="day-name">${nomeDia}</span>
            </div>
            <div class="history-info">
              <div class="history-info-title">Treino</div>
              <div class="history-info-desc">${descricao}</div>
            </div>
            <div class="history-chevron">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M9 5L16 12L9 19" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </div>
          </div>
        `;
      }).join('');
    }

    function renderWeek() {
      dayStrip.innerHTML = "";
      calendarMonthLabel.textContent = `${monthNames[currentWeekStart.getMonth()]} ${currentWeekStart.getFullYear()}`;

      for (let i = 0; i < 7; i++) {
        const loopDate = new Date(currentWeekStart);
        loopDate.setDate(currentWeekStart.getDate() + i);

        const dayNum = loopDate.getDate();
        const dowName = dowNamesShort[loopDate.getDay()];

        const button = document.createElement('button');
        button.className = "day-pill";
        button.setAttribute('data-full-date', loopDate.toISOString());

        button.innerHTML = `
          <span class="num">${dayNum}</span>
          <span class="dow">${dowName}</span>
        `;

        const isFuture = isFutureDate(loopDate, realToday);
        const isToday = isSameDay(loopDate, realToday);
        const isPast = !isFuture && !isToday;

        if (isFuture) {
          button.disabled = true;
        } else {
          if (isToday) {
            button.classList.add('today');
          } else if (isPast) {
            button.classList.add('past');
            const stats = getStats();
            const registroDoDia = stats.diario && stats.diario[formatarDataChave(loopDate)];
            if (registroDoDia && Object.keys(registroDoDia).length > 0) {
              button.classList.add('workout');
            } else {
              button.classList.add('no-workout');
            }
          }

          button.addEventListener('click', () => {
            document.querySelectorAll('.day-pill').forEach(b => b.classList.remove('selected'));
            button.classList.add('selected');
            activeSelectedDate = new Date(loopDate);
            updateQuote(dayNum);
          });
        }

        if (isSameDay(loopDate, activeSelectedDate)) {
          button.classList.add('selected');
          updateQuote(dayNum);
        }

        dayStrip.appendChild(button);
      }

      const nextWeekFirstDay = new Date(currentWeekStart);
      nextWeekFirstDay.setDate(currentWeekStart.getDate() + 7);

      if (isFutureDate(nextWeekFirstDay, realToday)) {
        nextWeekBtn.disabled = true;
      } else {
        nextWeekBtn.disabled = false;
      }
    }

    prevWeekBtn.addEventListener('click', () => {
      currentWeekStart.setDate(currentWeekStart.getDate() - 7);
      renderWeek();
      renderResumoSemanal();
    });

    nextWeekBtn.addEventListener('click', () => {
      currentWeekStart.setDate(currentWeekStart.getDate() + 7);
      renderWeek();
      renderResumoSemanal();
    });

    renderWeek();
    renderMuscleChart();
    renderResumoSemanal();
    renderHomeHistoryList();
  }

  function iniciarLogicaTelaHistorico() {
    const MUSCLE_LABELS_HIST = { peito: 'Peito', costas: 'Costas', biceps: 'Bíceps', triceps: 'Tríceps', ombro: 'Ombros', pernas: 'Pernas/Glúteo' };
    const PHOTO_LABELS_HIST = { frente: 'Frente', lateral1: 'Lateral 1', lateral2: 'Lateral 2', costa: 'Costas', pernas: 'Pernas', biceps: 'Bíceps' };

    function juntarNomesMusculosHist(chaves) {
      const nomes = chaves.map(c => MUSCLE_LABELS_HIST[c] || c);
      if (nomes.length <= 2) return nomes.join(' e ');
      return `${nomes.slice(0, -1).join(', ')} e ${nomes[nomes.length - 1]}`;
    }

    // Reúne, para uma data específica, tudo que o usuário realmente fez naquele dia
    function obterEventosDoDia(dateStr) {
      const stats = getStats();
      const eventos = [];

      const registroTreino = stats.diario && stats.diario[dateStr];
      if (registroTreino && Object.keys(registroTreino).length > 0) {
        const musculos = Object.keys(registroTreino);
        eventos.push({
          type: 'forca',
          title: 'Treino',
          subtitle: juntarNomesMusculosHist(musculos)
        });
      }

      const fotosDoDia = stats.fotosPorData && stats.fotosPorData[dateStr];
      if (fotosDoDia && fotosDoDia.length > 0) {
        const posicoes = fotosDoDia.map(f => PHOTO_LABELS_HIST[f.tipo] || f.tipo);
        eventos.push({
          type: 'foto',
          title: 'Nova foto de evolução',
          subtitle: posicoes.join(', ')
        });
      }

      const conquistasDoDia = stats.conquistasPorData && stats.conquistasPorData[dateStr];
      if (conquistasDoDia && conquistasDoDia.length > 0) {
        conquistasDoDia.forEach(id => {
          const info = ACHIEVEMENT_LABELS[id] || { titulo: 'Conquista desbloqueada', desc: '' };
          eventos.push({
            type: 'conquista',
            title: 'Conquista',
            subtitle: info.titulo
          });
        });
      }

      return eventos;
    }

    function temEventosNaData(dateStr) {
      const stats = getStats();
      const temTreino = temTreinoConcluidoNaData(dateStr);
      const temFoto = stats.fotosPorData && stats.fotosPorData[dateStr] && stats.fotosPorData[dateStr].length > 0;
      const temConquista = stats.conquistasPorData && stats.conquistasPorData[dateStr] && stats.conquistasPorData[dateStr].length > 0;
      return !!(temTreino || temFoto || temConquista);
    }

    // Usada para pintar o dia de laranja no calendário: só considera dias
    // em que algum exercício foi realmente concluído (não fotos/conquistas)
    function temTreinoConcluidoNaData(dateStr) {
      const stats = getStats();
      return !!(stats.diario && stats.diario[dateStr] && Object.keys(stats.diario[dateStr]).length > 0);
    }

    const today = new Date();
    today.setHours(0, 0, 0, 0);

    let currentMonth = today.getMonth();
    let currentYear = today.getFullYear();

    // Calendário começa limpo: nenhuma data pré-selecionada
    let rangeStart = null;
    let rangeEnd = null;

    const weekdaysShort = ['DOM', 'SEG', 'TER', 'QUA', 'QUI', 'SEX', 'SÁB'];
    const monthNames = ["Janeiro", "Fevereiro", "Março", "Abril", "Maio", "Junho", "Julho", "Agosto", "Setembro", "Outubro", "Novembro", "Dezembro"];

    const calendarGrid = document.getElementById('calendar-grid');
    const monthLabel = document.getElementById('month-label');
    const historyContent = document.getElementById('history-content');

    function createMidnightDate(year, month, day) { return new Date(year, month, day, 0, 0, 0, 0); }

    function generateCalendar(month, year) {
      calendarGrid.innerHTML = '';
      monthLabel.textContent = `${monthNames[month]} ${year}`;
      const firstDayIndex = new Date(year, month, 1).getDay();
      const totalDays = new Date(year, month + 1, 0).getDate();
      for (let i = 0; i < firstDayIndex; i++) { calendarGrid.appendChild(document.createElement('div')); }
      for (let day = 1; day <= totalDays; day++) {
        const btn = document.createElement('button');
        btn.classList.add('day');
        btn.textContent = day;
        const thisDate = createMidnightDate(year, month, day);

        // BLOQUEIO DE DATAS FUTURAS
        if (thisDate > today) { btn.classList.add('disabled'); }

        const dateStr = formatDateString(thisDate);
        btn.setAttribute('data-date', dateStr);
        if (temTreinoConcluidoNaData(dateStr)) btn.classList.add('has-workout');

        if (!btn.classList.contains('disabled')) {
          btn.addEventListener('click', () => handleDayClick(thisDate));
        }
        calendarGrid.appendChild(btn);
      }
      updateCalendarRangeStyles();
    }

    function handleDayClick(clickedDate) {
      const clickedTime = clickedDate.getTime();
      if (!rangeStart || (rangeStart && rangeEnd)) { rangeStart = clickedDate; rangeEnd = null; }
      else {
        const startTime = rangeStart.getTime();
        if (clickedTime > startTime) rangeEnd = clickedDate;
        else if (clickedTime < startTime) { rangeStart = clickedDate; rangeEnd = null; }
        else { rangeStart = null; rangeEnd = null; }
      }
      updateCalendarRangeStyles();
      renderCombinedHistory();
    }

    function updateCalendarRangeStyles() {
      const dayButtons = document.querySelectorAll('#tela-historico .day');
      dayButtons.forEach(btn => {
        const dateParts = btn.getAttribute('data-date').split('-');
        const btnDate = createMidnightDate(parseInt(dateParts[0]), parseInt(dateParts[1]) - 1, parseInt(dateParts[2]));
        const timeVal = btnDate.getTime();
        btn.classList.remove('range-single', 'range-start', 'range-mid', 'range-end');
        if (rangeStart && !rangeEnd && timeVal === rangeStart.getTime()) btn.classList.add('range-single');
        else if (rangeStart && rangeEnd) {
          if (timeVal === rangeStart.getTime()) btn.classList.add('range-start');
          else if (timeVal === rangeEnd.getTime()) btn.classList.add('range-end');
          else if (timeVal > rangeStart.getTime() && timeVal < rangeEnd.getTime()) btn.classList.add('range-mid');
        }
      });
    }

    function renderCombinedHistory() {
      if (!rangeStart) { historyContent.innerHTML = `<div class="empty-history-msg">Selecione uma data para ver o histórico.</div>`; return; }
      const start = rangeStart;
      const end = rangeEnd ? rangeEnd : rangeStart;
      let combinedRecords = [];
      let loopDate = new Date(start.getTime());
      while (loopDate.getTime() <= end.getTime()) {
        const formatted = formatDateString(loopDate);
        obterEventosDoDia(formatted).forEach(record => {
          combinedRecords.push({ dayNum: loopDate.getDate(), dayName: weekdaysShort[loopDate.getDay()], ...record });
        });
        loopDate.setDate(loopDate.getDate() + 1);
      }
      if (combinedRecords.length === 0) { historyContent.innerHTML = `<div class="empty-history-msg">Nenhum treino no período.</div>`; return; }
      let html = `<div class="history-card">`;
      combinedRecords.forEach(item => {
        html += `<a href="#" class="history-item ${item.type}"><div class="history-date"><span class="day-num">${item.dayNum}</span><span class="day-name">${item.dayName}</span></div><div class="history-info"><span class="history-title">${item.title}</span><span class="history-desc">${item.subtitle}</span></div></a>`;
      });
      historyContent.innerHTML = html + `</div>`;
    }

    function formatDateString(date) { return `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}-${String(date.getDate()).padStart(2, '0')}`; }

    document.getElementById('prev-month-btn').addEventListener('click', () => { currentMonth--; if (currentMonth < 0) { currentMonth = 11; currentYear--; } generateCalendar(currentMonth, currentYear); });
    document.getElementById('next-month-btn').addEventListener('click', () => { currentMonth++; if (currentMonth > 11) { currentMonth = 0; currentYear++; } generateCalendar(currentMonth, currentYear); });

    generateCalendar(currentMonth, currentYear);
    renderCombinedHistory();
  }
